name: Phase 0 Foundation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'

jobs:
  validate:
    name: Build, test, and policy gates
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.302
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Validate Phase 0
        shell: pwsh
        run: .\scripts\Validate-Phase0.ps1

      - name: Restore Microsoft SBOM tool
        shell: pwsh
        run: dotnet tool restore

      - name: Generate SPDX SBOM for validation output
        shell: pwsh
        run: >-
          dotnet tool run sbom-tool generate
          -b .\src\TheUnhingedProtocol.App\bin\Release\net10.0-windows10.0.26100.0\win-x64
          -bc .
          -pn TheUnhingedProtocol
          -pv 0.1.0
          -ps UnhingedForge
          -nsb https://github.com/UnhingedForge/The-Unhinged-Protocol

      - name: Upload validation SBOM
        uses: actions/upload-artifact@v7
        with:
          name: phase-0-validation-sbom
          path: src/TheUnhingedProtocol.App/bin/Release/net10.0-windows10.0.26100.0/win-x64/_manifest/
          if-no-files-found: error
          retention-days: 14
