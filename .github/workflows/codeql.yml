name: CodeQL

on:
  push:
    branches:
      - main
      - phase/0-foundation
  pull_request:
    branches:
      - main
  schedule:
    - cron: '31 6 * * 1'

permissions:
  contents: read
  security-events: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'

jobs:
  analyze:
    name: Analyze C#
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - name: Restore locked dependencies
        shell: pwsh
        run: dotnet restore .\TheUnhingedProtocol.slnx --locked-mode

      - name: Build x64
        shell: pwsh
        run: dotnet build .\TheUnhingedProtocol.slnx --configuration Release --no-restore -p:Platform=x64

      - name: Analyze
        uses: github/codeql-action/analyze@v4
